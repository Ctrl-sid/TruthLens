spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:truthlensdev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
