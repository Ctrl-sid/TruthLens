server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: truthlens-api

  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/truthlensdb
    username: postgres
    password: "$1dh46th@$1d"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: 9a6e8b1c4d7e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a
    expiration-ms: 86400000 # 24 hours
